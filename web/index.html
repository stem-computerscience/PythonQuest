<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Quest: Galactic Academy</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Python Quest</h1><p>Galactic Academy · Learn Python through adventure</p></header><main><section id="login"><h2>Student login</h2><form id="loginForm"><label>Username <input id="username" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button>Log in</button></form><p id="loginMessage" role="status"></p></section><section id="game" hidden><nav><span id="welcome"></span> <button id="logout">Log out</button></nav><label>World <select id="world"><option value="space">Space Quest</option><option value="dungeon">Dungeon Quest</option></select></label><h2 id="mission">Mission 1: Activate your terminal</h2><p>Use Python to print a greeting, then press Run.</p><div class="columns"><div><h3>World</h3><div id="map" aria-label="Game world"></div><p id="status"></p></div><div><h3>Python editor</h3><textarea id="code" spellcheck="false">print("Hello, world!")</textarea><button id="run">Run Python</button><pre id="output"></pre></div></div><p id="progress"></p></section><section id="teacher" hidden><h2>Teacher dashboard</h2><form id="createStudent"><input id="newUsername" placeholder="New student username" required><input id="newPassword" type="password" placeholder="Temporary password (12+ characters)" minlength="12" required><button>Create student</button></form><p id="teacherStatus"></p><button id="refresh">Refresh student list</button><div id="students"></div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
